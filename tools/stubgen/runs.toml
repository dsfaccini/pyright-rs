# Generator runs. Each run writes out/<name>/stubs (one module per file) and out/<name>/deps
# (type-only placeholders for the files the stubs name, used by the compile check).

[runs.binder]
# Milestone 1 binder group (PLAN.md step 4).
files = [
    "analyzer/binder.ts",
    "analyzer/scope.ts",
    "analyzer/symbol.ts",
    "analyzer/declaration.ts",
    "analyzer/codeFlowTypes.ts",
    "analyzer/analyzerNodeInfo.ts",
    "analyzer/parseTreeWalker.ts",
    "analyzer/parseTreeUtils.ts",
    "analyzer/staticExpressions.ts",
]

[runs.evaluator]
# PLAN.md step 5: the evaluator block and the checker, installed into crates/pyright/src.
install = true
heap = "eval"
files = [
    # evaluator core
    "analyzer/typeEvaluator.ts",
    "analyzer/typeEvaluatorTypes.ts",
    "analyzer/types.ts",
    "analyzer/typeUtils.ts",
    "analyzer/typeCacheUtils.ts",
    "analyzer/typeWalker.ts",
    "analyzer/typeComplexity.ts",
    "analyzer/sentinel.ts",
    "analyzer/symbolUtils.ts",
    # code flow and narrowing
    "analyzer/codeFlowEngine.ts",
    "analyzer/typeGuards.ts",
    "analyzer/patternMatching.ts",
    # constraints and operations
    "analyzer/constraintSolver.ts",
    "analyzer/constraintTracker.ts",
    "analyzer/constraintSolution.ts",
    "analyzer/operations.ts",
    "analyzer/typePrinter.ts",
    "analyzer/typePrinterUtils.ts",
    "analyzer/parameterUtils.ts",
    "analyzer/functionTransform.ts",
    "analyzer/declarationUtils.ts",
    "analyzer/sourceMapper.ts",
    "analyzer/sourceMapperUtils.ts",
    "analyzer/constructors.ts",
    # special classes
    "analyzer/dataClasses.ts",
    "analyzer/typedDicts.ts",
    "analyzer/protocols.ts",
    "analyzer/enums.ts",
    "analyzer/decorators.ts",
    "analyzer/properties.ts",
    "analyzer/tuples.ts",
    "analyzer/namedTuples.ts",
    "analyzer/constructorTransform.ts",
    # the checker
    "analyzer/checker.ts",
    "analyzer/deprecatedSymbols.ts",
]
