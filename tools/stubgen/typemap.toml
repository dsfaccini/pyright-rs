# Type-mapping table for tools/stubgen. Edit this file, not the generator, to change a mapping.
# docs/evaluator-design.md explains every rule; this file holds the per-type and per-site choices.
#
# Keys name a pyright declaration as "<path under packages/pyright-internal/src>:<Name>".
# Library and package types use their bare name ("RegExp", "CancellationToken").
# Number sites live in numbers.toml.

# Declarations not ported. The stub keeps only their marker.
skip = [
    # The type of createTypeEvaluator's `wrapWithLogger`, which the port drops ([factories]).
    "analyzer/typeEvaluator.ts:LogWrapper",
]

# TypeScript type -> Rust type. A string is the Rust type in every position, passed as `&T` unless
# `copy = true`. A table can give `param`, the Rust type in parameter position. $0, $1 are the
# mapped type arguments.
[types]
bigint = { rust = "jsrt::JsBigInt" }
# porting.md "numbers": a Python number literal is NumberValue.
"bigint | number" = { rust = "NumberValue", use = "jsrt::NumberValue" }
# A class name or a list of class names.
"string | string[]" = { rust = "Vec<String>", param = "&[String]" }
# The CLI check runs to completion: nothing cancels it and nothing on the check path awaits.
CancellationToken = { rust = "()", copy = true }
# Pyright's patterns have no `u` flag; spell JS-only escapes with jsrt::js_regex fragments.
RegExp = { rust = "Regex", use = "regex::Regex" }
Promise = "$0"
# Ported by hand as a generic over its element (crates/pyright/src/common/text_range_collection.rs).
"common/textRangeCollection.ts:TextRangeCollection" = { rust = "TextRangeCollection<$0>", use = "crate::common::text_range_collection::TextRangeCollection" }
# The key of a parse tree: its module node (`node.a = node` in ModuleNode.create).
"parser/parseNodes.ts:ParseTreeKey" = { rust = "jsrt::P<crate::parser::parse_nodes::ParseNode>", copy = true }
# A `Map<string, Symbol>` held by reference: a module type holds its scope's table (typeEvaluator.ts:24280),
# `isTypeSame` compares module tables with `===` (types.ts:3766), and spread copies of a type share it.
"analyzer/symbol.ts:SymbolTable" = { rust = "SymbolTable", use = "crate::analyzer::symbol::SymbolTable", copy = true }

# How a class or interface is held (default rules in docs/evaluator-design.md, "objects"):
# "handle": `P<T>`, shared by reference; fields written after construction get Cell/RefCell.
# "value": an owned struct; parameters take `&T`.
# "owned": a class whose methods take `&mut self`, with plain fields.
[modes]
# Holds a FnOnce, so it cannot be cloned.
"analyzer/binder.ts:DeferredBindingTask" = "owned"
# Small immutable position records.
"common/textRange.ts:TextRange" = "value"
"common/textRange.ts:Range" = "value"
"common/textRange.ts:Position" = "value"
# Per-instance records that `TypeBase.cloneType` copies with a spread: a clone gets its own copy.
# They sit in a RefCell in the type, so writes through one P<Type> stay visible to its holders.
"analyzer/types.ts:TypeBaseProps" = "value"
"analyzer/types.ts:CachedTypeInfo" = "value"
"analyzer/types.ts:ClassDetailsPriv" = "value"
"analyzer/types.ts:FunctionDetailsPriv" = "value"
"analyzer/types.ts:ModuleDetailsPriv" = "value"
"analyzer/types.ts:OverloadedDetailsPriv" = "value"
"analyzer/types.ts:TypeVarDetailsPriv" = "value"
"analyzer/types.ts:UnionDetailsPriv" = "value"
# Copied with a spread before every write, and never compared with `===`.
"analyzer/types.ts:TypedDictEntry" = "value"
"analyzer/typeEvaluatorTypes.ts:ValidateArgTypeParams" = "value"
"analyzer/typeEvaluator.ts:MatchArgsToParamsResult" = "value"
# Held only by their stack; written through an index into it.
"analyzer/typeEvaluator.ts:SymbolResolutionStackEntry" = "value"
"analyzer/typeEvaluator.ts:SuppressedNodeStackEntry" = "value"
# Written only by adjustSourceParamDetailsForDestVariadic (typeEvaluator.ts:28091), through its
# `srcDetails` parameter. Its one caller (28256) passes a local fresh from getParamListDetails
# (28248, 28251); no array, field or longer-lived variable holds one, so `&mut` reaches every holder.
"analyzer/parameterUtils.ts:ParamListDetails" = "value"
# TypeResult, EffectiveTypeResult and other results keep the default (handle): the evaluator
# caches the object and writes it after storing it (typeEvaluator.ts:1348-1353, 24668, 25483).
# Rewritten from behavior (PLAN.md): one Rust type, its shape chosen by whoever ports common/uri.
"common/uri/uri.ts:Uri" = "opaque"

# Classes and interfaces that become Rust traits. `receiver` is the receiver of every method
# (default: "&mut self" for classes, "&self" for interfaces). `accessors` records how a hand-ported
# trait reads a field of its trait class: `name` renames the accessor, `by_value` returns the field
# by value, `drop` leaves out the accessor and the implementing struct's field.
[traits]
# As ported in crates/pyright/src/analyzer/parse_tree_walker.rs. `_getStringAnnotation` is a
# closure bound to the method `getStringAnnotation`; the Rust trait calls the method.
"analyzer/parseTreeWalker.ts:ParseTreeVisitor" = { receiver = "&mut self", accessors = { _default = { name = "default_visit_result", by_value = true } } }
"analyzer/parseTreeWalker.ts:ParseTreeWalker" = { receiver = "&mut self", accessors = { _annotationNodeInfo = { name = "annotation_node_info" }, _getStringAnnotation = { drop = true } } }
# Called through the interface; several classes and object literals implement them.
"analyzer/analyzerNodeInfo.ts:AnalyzerNodeInfoReader" = {}
"analyzer/analyzerNodeInfo.ts:AnalyzerNodeInfoWriter" = {}
"analyzer/analyzerNodeInfo.ts:AnalyzerNodeInfoBindingSession" = {}
"analyzer/analyzerNodeInfo.ts:AnalyzerNodeInfoContext" = {}
"analyzer/cellChainIndex.ts:CellChainIndexProvider" = {}
# Subclassed in typeUtils.ts (ContainsLiteralTypeWalker, AnyWalker, AnyOrUnknownWalker), which override
# its visit methods.
"analyzer/typeWalker.ts:TypeWalker" = { receiver = "&mut self" }
# Ported as a trait (crates/pyright/src/common/console.rs).
"common/console.ts:ConsoleInterface" = {}
# Read through the interface by `contextualTypeCacheEntryMatches` and `addContextualTypeCacheEntry`;
# `SpeculativeTypeEntry` and `TypeFormTypeCacheEntry` (typeEvaluator.ts:640) extend it.
"analyzer/typeCacheUtils.ts:ContextualTypeCacheEntry" = {}

# Unions discriminated by a kind field become one struct plus an enum of per-kind details
# (docs/porting.md, "types, classes and unions").
# base: the interface with the common fields; union: the TS union naming every member;
# kind: the discriminant field (left out when members are told apart by flags);
# flatten: a slot field whose object type is spread into the details struct;
# all_fields_mutable: every field is Cell/RefCell (porting.md "parse nodes");
# root_variant: the variant for objects created as the base itself;
# typed_handles = false: members are P<Root>, with no typed handle (default true);
# empty_variants = "unit": a member without fields of its own is a unit variant (default "struct");
# private_details = true: the details field and enum are private to the family's module, so other
# code reaches details only through typed handles and `d()`, and creates objects only through the
# module's create functions.
[families.ParseNode]
file = "parser/parseNodes.ts"
base = "ParseNodeBase"
union = "ParseNode"
kind = "nodeType"
flatten = "d"
all_fields_mutable = true

[families.Token]
file = "parser/tokenizerTypes.ts"
base = "TokenBase"
union = "Token"
kind = "type"
# As ported in crates/pyright/src/parser/tokenizer_types.rs.
root_variant = "None"

[families.Type]
file = "analyzer/types.ts"
base = "TypeBase"
union = "Type"
kind = "category"
# docs/porting.md "memory": the layout of type details will change.
private_details = true

[families.Declaration]
file = "analyzer/declaration.ts"
base = "DeclarationBase"
union = "Declaration"
kind = "type"
# As ported in crates/pyright/src/analyzer/declaration.rs: every member is a P<Declaration>, and a
# kind without fields of its own is a unit variant.
typed_handles = false
empty_variants = "unit"

[families.FlowNode]
file = "analyzer/codeFlowTypes.ts"
base = "FlowNode"
root_variant = "Plain"

# Interfaces folded into another: the target struct gains the source's extra fields, and the
# source becomes a type alias of the target.
[merge]
"common/uri/uriInterface.ts:Uri" = "common/uri/uri.ts:Uri"
"analyzer/types.ts:ParamSpecDetailsPriv" = "TypeVarDetailsPriv"
"analyzer/types.ts:TypeVarTupleDetailsPriv" = "TypeVarDetailsPriv"
# The evaluator hands its own TypeResult object to the speculative tracker, which stores it and
# returns it from `getSpeculativeType`; the evaluator writes `typeResult.type` after caching it
# (typeEvaluator.ts:1349), so the entry must hold the same object.
"analyzer/typeCacheUtils.ts:TypeResult" = "analyzer/typeEvaluatorTypes.ts:TypeResult"

# Closure factories: functions that build an object out of nested closures over shared locals.
# Each becomes a struct (docs/evaluator-design.md).
[factories.TypeEvaluator]
file = "analyzer/typeEvaluator.ts"
function = "createTypeEvaluator"
interface = "analyzer/typeEvaluatorTypes.ts:TypeEvaluator"
drop_params = ["wrapWithLogger"]
self_names = ["evaluatorInterface"]
wrappers = ["wrapWithLogger"]

[factories.CodeFlowEngine]
file = "analyzer/codeFlowEngine.ts"
function = "getCodeFlowEngine"
interface = "analyzer/codeFlowEngine.ts:CodeFlowEngine"

[factories.CodeFlowAnalyzer]
file = "analyzer/codeFlowEngine.ts"
function = "getCodeFlowEngine.createCodeFlowAnalyzer"
interface = "analyzer/codeFlowEngine.ts:CodeFlowAnalyzer"

# Per-site Rust type, overriding the mapping: "<file>:<site>" = "Rust type", used verbatim in every
# position. Qualify names outside the module (`jsrt::P`) and the generator imports them.
[sites]
# Deferred binding callbacks run later with the binder that queued them.
"analyzer/binder.ts:DeferredBindingTask.callback" = "Box<dyn FnOnce(&mut crate::analyzer::binder::Binder)>"
"analyzer/binder.ts:Binder._deferBinding.callback" = "Box<dyn FnOnce(&mut crate::analyzer::binder::Binder)>"
# One code-flow expression set is shared by the binder, its deferred tasks and the node-info store,
# and the binder keeps adding to it after storing it.
"analyzer/binder.ts:DeferredBindingTask.codeFlowExpressions" = "jsrt::P<std::cell::RefCell<jsrt::JsSet<String>>>"
"analyzer/binder.ts:Binder._currentScopeCodeFlowExpressions" = "Option<jsrt::P<std::cell::RefCell<jsrt::JsSet<String>>>>"
"analyzer/binder.ts:Binder._trackCodeFlowExpressions.return" = "jsrt::P<std::cell::RefCell<jsrt::JsSet<String>>>"
"analyzer/codeFlowTypes.ts:FlowLabel.affectedExpressions" = "Option<jsrt::P<std::cell::RefCell<jsrt::JsSet<String>>>>"
"analyzer/analyzerNodeInfo.ts:AnalyzerNodeInfo.codeFlowExpressions" = "jsrt::P<std::cell::RefCell<jsrt::JsSet<String>>>"
"analyzer/analyzerNodeInfo.ts:AnalyzerNodeInfoAccessor.getCodeFlowExpressions.return" = "Option<jsrt::P<std::cell::RefCell<jsrt::JsSet<String>>>>"
"analyzer/analyzerNodeInfo.ts:AnalyzerNodeInfoAccessor.setCodeFlowExpressions.expressions" = "jsrt::P<std::cell::RefCell<jsrt::JsSet<String>>>"
"analyzer/analyzerNodeInfo.ts:getCodeFlowExpressions.return" = "Option<jsrt::P<std::cell::RefCell<jsrt::JsSet<String>>>>"
"analyzer/analyzerNodeInfo.ts:setCodeFlowExpressions.expressions" = "jsrt::P<std::cell::RefCell<jsrt::JsSet<String>>>"
# Arrays held by reference. `{ ...type.shared }` and `FunctionType.clone` copy the reference, and
# `expandTypedKwargs` splices and pushes the clone's arrays, which changes the original function too
# (typeEvaluator.ts:2919-2923, 2944).
"analyzer/types.ts:FunctionDetailsShared.parameters" = "jsrt::P<std::cell::RefCell<Vec<crate::analyzer::types::FunctionParam>>>"
"analyzer/types.ts:SpecializedFunctionTypes.parameterTypes" = "jsrt::P<std::cell::RefCell<Vec<jsrt::P<crate::analyzer::types::Type>>>>"
"analyzer/types.ts:SpecializedFunctionTypes.parameterDefaultTypes" = "Option<jsrt::P<std::cell::RefCell<Vec<Option<jsrt::P<crate::analyzer::types::Type>>>>>>"
# Getters that return live state their callers write to.
"analyzer/types.ts:TypeBase.addProps.return" = "std::cell::RefMut<'static, crate::analyzer::types::TypeBaseProps>"
# The type caches are passed by reference to the speculative type tracker, which deletes from the
# very map it was given (typeCacheUtils.ts:133); the return-inference ones are swapped per call.
"analyzer/typeEvaluator.ts:createTypeEvaluator.typeCache" = "jsrt::P<std::cell::RefCell<jsrt::JsMap<u32, crate::analyzer::type_evaluator::TypeCacheEntry>>>"
"analyzer/typeEvaluator.ts:createTypeEvaluator.typeFormTypeCache" = "jsrt::P<std::cell::RefCell<jsrt::JsMap<u32, Vec<crate::analyzer::type_evaluator::TypeFormTypeCacheEntry>>>>"
"analyzer/typeEvaluator.ts:createTypeEvaluator.returnTypeInferenceTypeCache" = "Option<jsrt::P<std::cell::RefCell<jsrt::JsMap<u32, crate::analyzer::type_evaluator::TypeCacheEntry>>>>"
"analyzer/typeEvaluator.ts:createTypeEvaluator.returnTypeInferenceTypeFormTypeCache" = "Option<jsrt::P<std::cell::RefCell<jsrt::JsMap<u32, Vec<crate::analyzer::type_evaluator::TypeFormTypeCacheEntry>>>>>"
"analyzer/typeEvaluator.ts:createTypeEvaluator.getTypeFormTypeCache.return" = "jsrt::P<std::cell::RefCell<jsrt::JsMap<u32, Vec<crate::analyzer::type_evaluator::TypeFormTypeCacheEntry>>>>"
# The speculative tracker deletes entries from the very cache it was handed (typeCacheUtils.ts:133):
# an evaluator type cache (typeEvaluator.ts:912) or a code-flow node type cache (codeFlowEngine.ts:314).
"analyzer/typeCacheUtils.ts:SpeculativeEntry.cache" = "crate::analyzer::type_cache_utils::SpeculativeCache"
"analyzer/typeCacheUtils.ts:SpeculativeTypeTracker.trackEntry.cache" = "crate::analyzer::type_cache_utils::SpeculativeCache"
"analyzer/codeFlowEngine.ts:CodeFlowTypeCache.cache" = "jsrt::P<std::cell::RefCell<jsrt::JsMap<u32, Option<crate::analyzer::code_flow_engine::CachedType>>>>"
# One speculative tracker is shared by the evaluator and its code flow engine (typeEvaluator.ts:30591):
# contexts the evaluator enters decide what the engine's `trackEntry` and `isSpeculative` see.
"analyzer/typeEvaluator.ts:createTypeEvaluator.speculativeTypeTracker" = "jsrt::P<std::cell::RefCell<crate::analyzer::type_cache_utils::SpeculativeTypeTracker>>"
"analyzer/codeFlowEngine.ts:getCodeFlowEngine.speculativeTypeTracker" = "jsrt::P<std::cell::RefCell<crate::analyzer::type_cache_utils::SpeculativeTypeTracker>>"
# `object` in types.ts; protocols.ts keeps its protocol compatibility cache there (protocols.ts:297).
"analyzer/types.ts:ClassDetailsShared.protocolCompatibility" = "jsrt::JsMap<String, Vec<crate::analyzer::protocols::ProtocolCompatibility>>"
# Object-literal dictionaries keyed by operator, only looked up, never iterated.
"analyzer/operations.ts:binaryOperatorMap" = "jsrt::JsMap<crate::parser::tokenizer_types::OperatorType, (String, String)>"
"analyzer/operations.ts:booleanOperatorMap" = "jsrt::JsMap<crate::parser::tokenizer_types::OperatorType, bool>"
# Stores keyed by a parse tree key (`node.a`): the module node.
"analyzer/analyzerNodeInfo.ts:AnalyzerNodeInfoStore._infoByTree" = "jsrt::JsMap<jsrt::P<crate::parser::parse_nodes::ParseNode>, jsrt::JsMap<jsrt::P<crate::parser::parse_nodes::ParseNode>, jsrt::P<crate::analyzer::analyzer_node_info::AnalyzerNodeInfo>>>"
"analyzer/analyzerNodeInfo.ts:AnalyzerNodeInfoStore._fileInfoByTree" = "jsrt::JsMap<jsrt::P<crate::parser::parse_nodes::ParseNode>, jsrt::P<crate::analyzer::analyzer_file_info::AnalyzerFileInfo>>"
"analyzer/analyzerNodeInfo.ts:AnalyzerNodeInfoContextLayer.stores" = "jsrt::JsMap<jsrt::P<crate::parser::parse_nodes::ParseNode>, jsrt::P<crate::analyzer::analyzer_node_info::AnalyzerNodeInfoStore>>"
"analyzer/analyzerNodeInfo.ts:AnalyzerNodeInfoContextLayer.removedKeys" = "jsrt::JsSet<jsrt::P<crate::parser::parse_nodes::ParseNode>>"
"analyzer/analyzerNodeInfo.ts:AnalyzerNodeInfoContextImpl._getRetiredStore.key" = "jsrt::P<crate::parser::parse_nodes::ParseNode>"
"analyzer/analyzerNodeInfo.ts:AnalyzerNodeInfoContextImpl._deleteRetiredStore.key" = "jsrt::P<crate::parser::parse_nodes::ParseNode>"
# Callers write `argsReceived` through the entry the lookup returns (typeEvaluator.ts:12617, 12809).
"analyzer/parameterUtils.ts:ParamAssignmentTracker.lookupName.return" = "Option<&mut crate::analyzer::parameter_utils::ParamAssignmentInfo>"
"analyzer/parameterUtils.ts:ParamAssignmentTracker.lookupDetails.return" = "&mut crate::analyzer::parameter_utils::ParamAssignmentInfo"
# `Map.set` returns the map; no caller reads it.
"analyzer/constraintSolution.ts:ConstraintSolutionSet.setType.return" = "()"
# `UniqueNameMap` methods take `&mut self` (`_addIfUnique` writes `_map`), so the printers that call
# `isUnique` hold it mutably.
"analyzer/typePrinter.ts:printTypeInternal.uniqueNameMap" = "&mut crate::analyzer::type_printer::UniqueNameMap"
"analyzer/typePrinter.ts:printUnionType.uniqueNameMap" = "&mut crate::analyzer::type_printer::UniqueNameMap"
"analyzer/typePrinter.ts:printFunctionType.uniqueNameMap" = "&mut crate::analyzer::type_printer::UniqueNameMap"
"analyzer/typePrinter.ts:printParamSpecValueForPythonSyntax.uniqueNameMap" = "&mut crate::analyzer::type_printer::UniqueNameMap"
"analyzer/typePrinter.ts:printObjectTypeForClassInternal.uniqueNameMap" = "&mut crate::analyzer::type_printer::UniqueNameMap"
"analyzer/typePrinter.ts:printFunctionPartsInternal.uniqueNameMap" = "&mut crate::analyzer::type_printer::UniqueNameMap"

# Bounds on a function's type parameter, which then stays a Rust generic instead of becoming its
# constraint: "<file>:<function>.<T>" = "<Rust bounds>".
[bounds]
# Called with the evaluator's `TypeFormTypeCacheEntry` and the tracker's `P<SpeculativeTypeEntry>`; it
# copies entries it keeps into the new list.
"analyzer/typeCacheUtils.ts:addContextualTypeCacheEntry.T" = "Clone + crate::analyzer::type_cache_utils::ContextualTypeCacheEntry"
# Copies the candidates into a new array.
"analyzer/typeEvaluatorTypes.ts:ensureExpectedTypeCandidates.T" = "Clone"

# Force interior mutability on or off for a field: "<file>:<Struct>.<field>" = true | false. A
# factory local is keyed like its [sites] entry: "<file>:<factory function>.<local>".
[mutable]
# A shared tracker handle ([sites]): writes go through its RefCell, and the field is never reassigned.
"analyzer/typeEvaluator.ts:createTypeEvaluator.speculativeTypeTracker" = false
# A shared map handle ([sites]): writes go through its RefCell, and the field is never reassigned.
"analyzer/codeFlowEngine.ts:CodeFlowTypeCache.cache" = false
# `OverloadedType.addOverload` pushes onto `priv._overloads` after the type exists (types.ts:2462).
"analyzer/types.ts:OverloadedType.priv" = true

[enums]
# Enums to emit as flags newtypes, or as plain enums, against the detection rule.
flags = []
plain = []

# Rust items the table defines, emitted verbatim into the module of "<file>:<Name>". Use qualified
# paths; the generator shortens them and adds the imports.
[items]
"analyzer/typeCacheUtils.ts:SpeculativeCache" = """
/// A type cache that a speculative context deletes its entries from when it ends
/// (typeCacheUtils.ts:133): an evaluator type cache (typeEvaluator.ts:912) or a code-flow node type
/// cache (codeFlowEngine.ts:314). TypeScript passes the map itself; the holder shares it.
#[derive(Clone, Copy)]
pub enum SpeculativeCache {
    Type(jsrt::P<std::cell::RefCell<jsrt::JsMap<u32, crate::analyzer::type_evaluator::TypeCacheEntry>>>),
    FlowNodeType(jsrt::P<std::cell::RefCell<jsrt::JsMap<u32, Option<crate::analyzer::code_flow_engine::CachedType>>>>),
}
"""
# TypeResult::new and Clone rely on the Cell and RefCell imports its fields give the module.
"analyzer/typeEvaluatorTypes.ts:TypeResult" = """
/// `{ type }` with every other field undefined: the object literal TypeScript writes for a
/// TypeResult. Set other fields with struct update syntax:
/// `P::new_eval(TypeResult { is_incomplete: Cell::new(Some(true)), ..TypeResult::new(t) })`.
impl TypeResult {
    pub fn new(type_: jsrt::P<crate::analyzer::types::Type>) -> TypeResult {
        TypeResult {
            type_: Cell::new(type_),
            is_incomplete: Cell::new(None),
            bind_to_self_type: None,
            unpacked_type: None,
            type_list: None,
            type_errors: Cell::new(None),
            inlined_type_dict: None,
            class_type: None,
            is_empty_tuple_shorthand: None,
            expected_type_diag_addendum: Cell::new(None),
            is_asymmetric_accessor: None,
            narrowed_type_for_set: None,
            is_required: None,
            is_not_required: None,
            is_read_only: None,
            overloads_used_for_call: RefCell::new(None),
            member_access_deprecation_info: None,
            magic_method_deprecation_info: None,
        }
    }
}

/// A spread, `{ ...typeResult }`: a new object with the same field values. Allocate the copy
/// with `P::new_eval` to get a new identity.
impl Clone for TypeResult {
    fn clone(&self) -> TypeResult {
        TypeResult {
            type_: self.type_.clone(),
            is_incomplete: self.is_incomplete.clone(),
            bind_to_self_type: self.bind_to_self_type,
            unpacked_type: self.unpacked_type,
            type_list: self.type_list.clone(),
            type_errors: self.type_errors.clone(),
            inlined_type_dict: self.inlined_type_dict,
            class_type: self.class_type,
            is_empty_tuple_shorthand: self.is_empty_tuple_shorthand,
            expected_type_diag_addendum: self.expected_type_diag_addendum.clone(),
            is_asymmetric_accessor: self.is_asymmetric_accessor,
            narrowed_type_for_set: self.narrowed_type_for_set,
            is_required: self.is_required,
            is_not_required: self.is_not_required,
            is_read_only: self.is_read_only,
            overloads_used_for_call: self.overloads_used_for_call.clone(),
            member_access_deprecation_info: self.member_access_deprecation_info.clone(),
            magic_method_deprecation_info: self.magic_method_deprecation_info.clone(),
        }
    }
}
"""
"analyzer/typeEvaluatorTypes.ts:TypeResultWithNode" = """
/// `{ type, node }` with every other field undefined.
impl TypeResultWithNode {
    pub fn new(
        type_: jsrt::P<crate::analyzer::types::Type>,
        node: jsrt::P<crate::parser::parse_nodes::ParseNode>,
    ) -> TypeResultWithNode {
        TypeResultWithNode {
            type_,
            is_incomplete: None,
            bind_to_self_type: None,
            unpacked_type: None,
            type_list: None,
            type_errors: None,
            inlined_type_dict: None,
            class_type: None,
            is_empty_tuple_shorthand: None,
            expected_type_diag_addendum: None,
            is_asymmetric_accessor: None,
            narrowed_type_for_set: None,
            is_required: None,
            is_not_required: None,
            is_read_only: None,
            overloads_used_for_call: None,
            member_access_deprecation_info: None,
            magic_method_deprecation_info: None,
            node,
        }
    }

    /// `{ ...typeResult, node }`: every field of `type_result`, plus `node`.
    pub fn from_type_result(
        type_result: &TypeResult,
        node: jsrt::P<crate::parser::parse_nodes::ParseNode>,
    ) -> TypeResultWithNode {
        TypeResultWithNode {
            type_: type_result.type_.get(),
            is_incomplete: type_result.is_incomplete.get(),
            bind_to_self_type: type_result.bind_to_self_type,
            unpacked_type: type_result.unpacked_type,
            type_list: type_result.type_list.clone(),
            type_errors: type_result.type_errors.get(),
            inlined_type_dict: type_result.inlined_type_dict,
            class_type: type_result.class_type,
            is_empty_tuple_shorthand: type_result.is_empty_tuple_shorthand,
            expected_type_diag_addendum: type_result.expected_type_diag_addendum.get(),
            is_asymmetric_accessor: type_result.is_asymmetric_accessor,
            narrowed_type_for_set: type_result.narrowed_type_for_set,
            is_required: type_result.is_required,
            is_not_required: type_result.is_not_required,
            is_read_only: type_result.is_read_only,
            overloads_used_for_call: type_result.overloads_used_for_call.borrow().clone(),
            member_access_deprecation_info: type_result.member_access_deprecation_info.clone(),
            magic_method_deprecation_info: type_result.magic_method_deprecation_info.clone(),
            node,
        }
    }
}
"""
"analyzer/typeEvaluatorTypes.ts:Arg" = """
/// Reads of the `ArgBase` members on an `Arg`, whichever variant holds it: TypeScript reads them
/// on the union. `type_result` and `value_expression` are optional on one variant only.
impl Arg {
    pub fn arg_category(&self) -> crate::parser::parse_nodes::ArgCategory {
