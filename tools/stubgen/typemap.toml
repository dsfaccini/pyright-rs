/// `{ type, node }` with every other field undefined.
impl TypeResultWithNode {
    pub fn new(
        type_: jsrt::P<crate::analyzer::types::Type>,
        node: jsrt::P<crate::parser::parse_nodes::ParseNode>,
    ) -> TypeResultWithNode {
