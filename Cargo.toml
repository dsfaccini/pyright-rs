[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.release]
debug = "line-tables-only"
# One codegen unit: timings stay comparable across unrelated edits.
codegen-units = 1
# Optimizes pyright with jsrt, std and the other crates as one module: about 15%
# less time on pydantic-ai for about 12 s more build.
lto = "fat"

[profile.profiling]
inherits = "release"
debug = true

# bench/build-dist.sh builds this profile with PGO and BOLT (bench/build-settings.md).
[profile.dist]
inherits = "release"
# About 3% less time once PGO is on. A panic aborts the process instead of
# exiting with FatalError (pyright::main).
panic = "abort"
